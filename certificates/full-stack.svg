<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#09142b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="50%" stop-color="#cb9b51"/>
      <stop offset="100%" stop-color="#f6e27a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.06" stroke="#00d9ff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="850"/>
    <line x1="300" y1="0" x2="300" y2="850"/>
    <line x1="500" y1="0" x2="500" y2="850"/>
    <line x1="700" y1="0" x2="700" y2="850"/>
    <line x1="900" y1="0" x2="900" y2="850"/>
    <line x1="1100" y1="0" x2="1100" y2="850"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
  </g>

  <!-- Ornate Double Borders -->
  <rect x="35" y="35" width="1130" height="780" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85"/>
  <rect x="48" y="48" width="1104" height="754" rx="8" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
  <rect x="58" y="58" width="1084" height="734" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Corner Brackets -->
  <g stroke="url(#goldGrad)" stroke-width="4" fill="none">
    <path d="M 35 75 L 35 35 L 75 35"/>
    <path d="M 1165 75 L 1165 35 L 1125 35"/>
    <path d="M 35 775 L 35 815 L 75 815"/>
    <path d="M 1165 775 L 1165 815 L 1125 815"/>
  </g>

  <!-- Header Badge & Top Label -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <rect x="-160" y="-20" width="320" height="34" rx="17" fill="rgba(0, 217, 255, 0.1)" stroke="#00d9ff" stroke-width="1.2"/>
    <text y="3" fill="#00d9ff" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3">VERIFIED CREDENTIAL • PROFESSIONAL</text>
  </g>

  <!-- Main Certificate Title -->
  <text x="600" y="200" text-anchor="middle" fill="url(#goldGrad)" font-family="'Outfit', 'Georgia', serif" font-size="44" font-weight="800" letter-spacing="4">
    CERTIFICATE OF ACHIEVEMENT
  </text>
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="16" letter-spacing="2">
    THIS ACKNOWLEDGES AND CERTIFIES THAT
  </text>

  <!-- Recipient Name -->
  <text x="600" y="325" text-anchor="middle" fill="#ffffff" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="2" filter="url(#glow)">
    R. KEERTHANA
  </text>
  <!-- Decorative Name Underline -->
  <path d="M 420 345 L 780 345" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="345" r="5" fill="#f6e27a"/>

  <!-- Achievement Description -->
  <text x="600" y="395" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="18" font-weight="400">
    has successfully demonstrated mastery and verified competence in
  </text>

  <!-- Skill Specialization Badge -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="rgba(246, 226, 122, 0.12)" stroke="url(#goldGrad)" stroke-width="2"/>
    <text y="7" fill="#f6e27a" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" letter-spacing="1.5">
      Full-Stack Web Development
    </text>
  </g>

  <!-- Detailed Scope -->
  <text x="600" y="525" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="15" font-weight="400">
    Encompassing Frontend Architectures, Responsive UI Engineering, Backend Integration,
  </text>
  <text x="600" y="550" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="15" font-weight="400">
    RESTful APIs, Database Design, and End-to-End Scalable Application Deployment.
  </text>

  <!-- Bottom Details: Signatures & Gold Seal -->
  <!-- Left: Issue Date & Cert ID -->
  <g transform="translate(140, 680)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">ACADEMIC COMMITTEE</text>
    <text x="110" y="42" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">DATE: SEPTEMBER 2024</text>
    <text x="110" y="58" text-anchor="middle" fill="#00d9ff" font-family="'JetBrains Mono', monospace" font-size="11">ID: FS-DEV-KEE-8910</text>
  </g>

  <!-- Center: Golden Seal / Medallion -->
  <g transform="translate(600, 675)">
    <!-- Ribbons -->
    <path d="M -22 35 L -35 85 L -10 72 L 0 85 L 0 35 Z" fill="#b45309" opacity="0.9"/>
    <path d="M 22 35 L 35 85 L 10 72 L 0 85 L 0 35 Z" fill="#b45309" opacity="0.9"/>
    <!-- Outer Star/Circle -->
    <circle cx="0" cy="0" r="48" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Inner Star Icon -->
    <path d="M 0 -18 L 5 -5 L 19 -5 L 8 4 L 12 18 L 0 9 L -12 18 L -8 4 L -19 -5 L -5 -5 Z" fill="url(#goldGrad)"/>
    <text x="0" y="28" text-anchor="middle" fill="#f6e27a" font-family="'Outfit', sans-serif" font-size="8" font-weight="800" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Right: Verification Director -->
  <g transform="translate(840, 680)">
    <!-- Simulated Signature -->
    <path d="M 30 -15 Q 60 -40 90 -10 T 150 -25 T 190 -10" fill="none" stroke="#f6e27a" stroke-width="2.5" opacity="0.85"/>
    <line x1="0" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">DIRECTOR OF CERTIFICATION</text>
    <text x="110" y="42" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">AUTHORIZED SIGNATURE</text>
  </g>
</svg>
